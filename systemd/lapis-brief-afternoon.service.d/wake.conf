# Gate-5 wrap (2026-06-01): brief synthesis calls StarHouse qwen (state_brief.py
# morning/afternoon -> qwen3.6-35b-a3b). After the Gate-6 all-hours sleep bind,
# StarHouse is asleep at brief time; wake-and-run wakes it + holds an idle
# inhibitor for the run, then it sleeps again. Reversible: delete this drop-in.
[Service]
ExecStart=
ExecStart=/usr/local/bin/wake-and-run /usr/bin/python3 -m lapis_pm.cli brief --period afternoon
