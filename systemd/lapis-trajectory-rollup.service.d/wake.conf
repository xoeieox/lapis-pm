# Gate-5 wrap (2026-06-01): trajectory-rollup digests call StarHouse qwen
# (trajectory.py QWEN_MODEL default). wake-and-run wakes+holds SH for the run.
# Reversible: delete this drop-in. (--rebuild-index is local but wrapping it is
# harmless and ensures SH is up for the digest passes that follow.)
[Service]
ExecStart=
ExecStart=/usr/local/bin/wake-and-run /usr/bin/python3 -m lapis_pm.cli trajectory-rollup --rebuild-index
ExecStart=/usr/local/bin/wake-and-run /usr/bin/python3 -m lapis_pm.cli trajectory-rollup --period per-target --all
ExecStart=/usr/local/bin/wake-and-run /usr/bin/python3 -m lapis_pm.cli trajectory-rollup --period weekly
ExecStart=/usr/local/bin/wake-and-run /usr/bin/python3 -m lapis_pm.cli trajectory-rollup --period monthly
